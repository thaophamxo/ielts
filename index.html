<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Practice</title>
<style>
:root{
  --ink:#1f3a4d;--muted:#5f7b8c;--line:rgba(74,159,201,.22);
  --blue:#4a9fc9;--mint:#5cc2a3;--card:rgba(255,255,255,.72);
  --ok:#2e9e74;--bad:#d9667a;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(135deg,#d6efff 0%,#dcf6ea 50%,#e4ecff 100%) fixed}
header{position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);background:rgba(255,255,255,.55);border-bottom:1px solid var(--line)}
.nav{max-width:1100px;margin:auto;padding:10px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;margin-right:auto;background:linear-gradient(90deg,var(--blue),var(--mint));-webkit-background-clip:text;color:transparent;font-size:18px}
.nav button{border:0;background:transparent;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--ink);font:inherit}
.nav button.on,.nav button:hover{background:rgba(74,159,201,.16)}
main{max-width:1100px;margin:auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(74,159,201,.10);margin-bottom:16px}
h1,h2,h3{margin:.2em 0 .5em}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tile{cursor:pointer;transition:.15s}
.tile:hover{transform:translateY(-3px)}
.tile .ic{font-size:28px}
.btn{border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--blue),var(--mint))}
.btn.ghost{background:rgba(74,159,201,.14);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 12px;font-size:14px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.9)}
textarea{min-height:140px;resize:vertical}
label{display:block;font-weight:600;margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:14px}
.split{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:800px){.split{grid-template-columns:1fr}}
.pass{max-height:70vh;overflow:auto;white-space:pre-wrap}
.q{padding:10px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border:0}
.opt{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.opt input{width:auto;margin-top:5px}
.q input.ans{max-width:260px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;color:var(--blue)}
.band{font-size:54px;font-weight:800;background:linear-gradient(90deg,var(--blue),var(--mint));-webkit-background-clip:text;color:transparent;line-height:1}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:rgba(92,194,163,.2);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars div{flex:1;min-width:10px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--blue),var(--mint));position:relative}
.bars span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px}
.crit{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:10px 0}
.crit>div{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.crit b{font-size:24px;display:block}
.corr{border-left:3px solid var(--blue);padding:4px 10px;margin:8px 0;background:rgba(255,255,255,.6);border-radius:0 10px 10px 0}
.err{color:var(--bad);white-space:pre-wrap}
.cue{background:linear-gradient(135deg,#fff,#e8f6ff);border:2px dashed var(--blue);border-radius:16px;padding:14px}
table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td input{padding:4px 8px;border-radius:8px}
a{color:var(--blue)}
details>summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header><div class="nav" id="nav"></div></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
/* ============ State ============ */
const LS = 'ielts.v1';
const DEMO = {
  id: 'demo-1', title: 'Demo – bài đọc ngắn (tự soạn, chỉ để thử app)', type: 'reading', minutes: 5,
  passages: [{ title: 'Urban Beekeeping', text:
`In recent years, beekeeping has moved from the countryside into the heart of many cities. Rooftop hives are now common in London, Paris and New York. Supporters argue that cities can actually be better for bees than farmland, because gardens and parks offer a wide range of flowers across the whole season, while large farms often grow a single crop that blooms for only a few weeks.

However, experts warn that the trend has limits. When too many hives are placed in one area, honeybees may compete with wild pollinators such as bumblebees for the same flowers. Some researchers therefore recommend that city councils plant more flowering trees rather than simply encouraging more hives.

Honey produced in cities has also attracted attention. Tests in several cities have shown that urban honey is generally safe to eat, and the amounts of heavy metals found were far below legal limits.` }],
  questions: [
    { qtype: 'tfng', prompt: 'Cities can offer bees flowers for a longer period than farmland.', options: ['TRUE', 'FALSE', 'NOT GIVEN'], answer: 'TRUE' },
    { qtype: 'tfng', prompt: 'Rooftop hives are banned in some European capitals.', options: ['TRUE', 'FALSE', 'NOT GIVEN'], answer: 'NOT GIVEN' },
    { qtype: 'tfng', prompt: 'Researchers suggest that cities should only encourage more hives.', options: ['TRUE', 'FALSE', 'NOT GIVEN'], answer: 'FALSE' },
    { qtype: 'fill', prompt: 'Too many hives may cause honeybees to compete with wild ________.', answer: 'pollinators|wild pollinators|bumblebees' },
    { qtype: 'fill', prompt: 'Heavy metals in urban honey were far below ________ limits.', answer: 'legal' }
  ]
};
let S = JSON.parse(localStorage.getItem(LS) || 'null') || { key: '', model: 'gemini-3.8-flash', tests: [DEMO], history: [], bank: { writing: [], speaking: [] } };
if (!S.model || /^gemini-2\.5/.test(S.model)) S.model = 'gemini-3.8-flash'; /* model cũ đã ngừng cho người dùng mới */
S.bank = S.bank || { writing: [], speaking: [] };
const save = () => localStorage.setItem(LS, JSON.stringify(S));
let timer = null, cur = {};
const QL = { tfng: 'True/False/Not Given', ynng: 'Yes/No/Not Given', mcq: 'Multiple choice', fill: 'Điền từ / completion', matching: 'Matching', heading: 'Matching headings', other: 'Khác' };

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const norm = s => String(s).toLowerCase().replace(/[.,;:!?'"()]/g, '').replace(/\s+/g, ' ').trim();
const round5 = x => Math.round(x * 2) / 2;
function startTimer(sec, el, onEnd) {
  clearInterval(timer); let t = sec; el.textContent = fmt(t);
  timer = setInterval(() => { t--; el.textContent = fmt(Math.max(t, 0)); if (t <= 0) { clearInterval(timer); onEnd && onEnd(); } }, 1000);
}
const LB = [[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[0,3.5]];
const RB = [[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[0,3.5]];
function toBand(type, raw, total) { const s = Math.round(raw / total * 40); return (type === 'listening' ? LB : RB).find(x => s >= x[0])[1]; }

async function gem(parts, json = true, max = 32768) {
  if (!S.key) throw new Error('Chưa nhập Gemini API key. Vào mục Cài đặt để nhập.');
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.model)}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': S.key },
    body: JSON.stringify({ contents: [{ parts }], generationConfig: json ? { responseMimeType: 'application/json', temperature: 0.2, maxOutputTokens: max } : { temperature: 0.7, maxOutputTokens: max } })
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error?.message || ('HTTP ' + r.status));
  const t = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  if (!json) return t;
  try { return JSON.parse(t.replace(/^```json\s*|```\s*$/g, '')); } catch { throw new Error('AI trả về dữ liệu bị cắt hoặc sai định dạng. Thử lại, hoặc nhập từng đề một.'); }
}
const addHistory = e => { S.history.push({ ...e, date: new Date().toISOString() }); save(); };

/* audio lưu trong IndexedDB */
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('ielts-audio', 1); r.onupgradeneeded = () => r.result.createObjectStore('a'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbPut = async (k, v) => { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction('a', 'readwrite'); t.objectStore('a').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); };
const idbGet = async k => { const d = await idb(); return new Promise((res, rej) => { const q = d.transaction('a').objectStore('a').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
const idbDel = async k => { try { const d = await idb(); d.transaction('a', 'readwrite').objectStore('a').delete(k); } catch {} };
const b64 = f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(f); });

/* ============ Router ============ */
const VIEWS = { home: ['Trang chủ', home], reading: ['Reading', () => library('reading')], listening: ['Listening', () => library('listening')], writing: ['Writing', writing], speaking: ['Speaking', speaking], import: ['Nhập sách', importView], history: ['Tiến độ', history], settings: ['Cài đặt', settings] };
function go(v) {
  clearInterval(timer); window.speechSynthesis && speechSynthesis.cancel(); cur = {};
  $('#nav').innerHTML = '<span class="brand">IELTS Practice</span>' + Object.entries(VIEWS).map(([k, [n]]) => `<button class="${k === v ? 'on' : ''}" onclick="go('${k}')">${n}</button>`).join('');
  VIEWS[v][1](); scrollTo(0, 0);
}
const app = h => $('#app').innerHTML = h;

/* ============ Home ============ */
function home() {
  const H = S.history, avg = k => { const a = H.filter(x => x.skill === k); return a.length ? round5(a.slice(-5).reduce((s, x) => s + x.band, 0) / Math.min(a.length, 5)) : '–'; };
  const tile = (k, ic, t, d) => `<div class="card tile" onclick="go('${k}')"><div class="ic">${ic}</div><h3>${t}</h3><div class="muted">${d}</div><div style="margin-top:8px">5 bài gần nhất: <b>${avg(k)}</b></div></div>`;
  app(`<h1>Chào bạn 👋</h1><p class="muted">Mục tiêu: Band 7.0 – 7.5. Chọn một kỹ năng để bắt đầu.</p>
  <div class="grid">${tile('reading','📖','Reading','Làm đề, chấm tự động, AI giải thích câu sai')}${tile('listening','🎧','Listening','Nghe audio, chấm tự động')}${tile('writing','✍️','Writing','AI chấm 4 tiêu chí + sửa lỗi')}${tile('speaking','🎤','Speaking','AI giám khảo hỏi Part 1-2-3')}</div>
  ${S.key ? '' : '<div class="card"><b>Bước đầu:</b> vào <a href="#" onclick="go(\'settings\');return false">Cài đặt</a> nhập Gemini API key để dùng AI (nhập đề, chấm, giải thích).</div>'}`);
}

/* ============ Thư viện đề + nhập bằng AI ============ */
function library(type) {
  const list = S.tests.filter(t => t.type === type);
  app(`<h1>${type === 'reading' ? 'Reading' : 'Listening'}</h1>
  <div class="card"><h3>Bộ đề của bạn</h3>
  ${list.length ? `<table>${list.map(t => `<tr><td><b>${esc(t.title)}</b> ${t.review ? '<span class="pill" style="background:rgba(217,102,122,.2)">cần rà đáp án</span>' : ''}${t.type === 'listening' ? (t.parts && t.parts.length ? '<span class="pill">có audio</span>' : '<span class="pill" style="background:rgba(217,102,122,.2)">chưa có audio</span>') : ''}<div class="muted">${t.questions.length} câu · ${t.minutes || 60} phút</div><div id="ed-${t.id}"></div></td>
  <td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="runTest('${t.id}')">Làm bài</button> ${t.type === 'listening' ? `<button class="btn sm ghost" onclick="audioPanel('${t.id}')">Audio</button> ` : ''}<button class="btn sm ghost" onclick="editAnswers('${t.id}')">Đáp án</button> <button class="btn sm ghost" onclick="delTest('${t.id}')">Xoá</button></td></tr>`).join('')}</table>` : '<p class="muted">Chưa có đề. Thêm đề ở bên dưới (chỉ làm một lần cho mỗi đề).</p>'}</div>

  <div class="card"><h3>Thêm đề mới</h3><p class="muted">Dùng mục <a href="#" onclick="go('import');return false">Nhập sách</a> để nhập nguyên cuốn PDF một lần (chỉ cần khai báo khoảng trang của từng đề). Audio gán bằng nút "Audio" ở từng đề Listening.</p></div>

  <div class="card"><h3>Lấy đề chính thức ở đâu?</h3>
  <div class="row"><a class="btn ghost sm" style="text-decoration:none" target="_blank" rel="noopener" href="https://ieltsonlinetests.com">ieltsonlinetests.com</a>
  <a class="btn ghost sm" style="text-decoration:none" target="_blank" rel="noopener" href="https://takeielts.britishcouncil.org">British Council</a>
  <a class="btn ghost sm" style="text-decoration:none" target="_blank" rel="noopener" href="https://ielts.org">IELTS.org</a></div></div>

  <details class="card"><summary>Nhập JSON thủ công (dự phòng)</summary>
  <textarea id="imp" style="margin-top:10px" placeholder='{"title":"...","type":"${type}","minutes":60,"questions":[{"qtype":"tfng","prompt":"...","options":["TRUE","FALSE","NOT GIVEN"],"answer":"TRUE"}]}'></textarea>
  <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="importTest()">Thêm đề</button></div><div id="impmsg"></div></details>`);
}
/* ============ Nhập sách (PDF nguyên cuốn) ============ */
let BOOK = null, IR = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
let AUDIO_FILES = null;
function importView() {
  app(`<h1>Nhập sách</h1>
  <p class="muted">Chỉ cần chọn PDF sách và folder audio, rồi bấm một nút. AI tự tìm trang của từng đề, đáp án và audioscript, nhập toàn bộ và gán audio. Bạn không phải điền số trang.</p>
  <div class="card"><h3>1. Chọn file PDF sách (nguyên cuốn)</h3>
  <input type="file" id="bk" accept=".pdf" onchange="loadBook(this)">
  <p class="muted" id="bki">${BOOK ? `<span class="ok">Đang dùng "${esc(BOOK.name)}": ${BOOK.pages} trang.</span>` : 'File được xử lý ngay trên máy bạn, không giới hạn dung lượng.'}</p></div>
  <div class="card"><h3>2. Chọn folder audio của sách (tuỳ chọn)</h3>
  <input type="file" webkitdirectory multiple onchange="pickAudioFolder(this)">
  <p class="muted" id="aui">${AUDIO_FILES ? `<span class="ok">Đã chọn ${AUDIO_FILES.length} file audio.</span>` : 'App tự đoán đề và Part theo tên file/folder (Test 1, Part 2...). Chọn xong, audio được gán ngay sau khi nhập đề.'}</p></div>
  <div class="card"><h3>3. Bắt đầu</h3>
  <div class="row"><button class="btn" id="autogo" onclick="autoImport()">Tự động nhập cả sách</button><button class="btn ghost" id="scango" onclick="scanOnly()">Chỉ quét, để tôi xem số trang trước</button></div>
  <p class="muted" style="margin-top:8px">Quét và nhập cả cuốn thường mất khoảng 15–30 phút (nhiều lượt gọi AI). Cứ để tab mở và làm việc khác.</p>
  <div id="slog" class="muted"></div></div>
  <div class="card"><h3>Kết quả</h3><div id="rlog" class="muted">Chưa chạy.</div><div id="alog" style="margin-top:8px"></div></div>
  <details class="card"><summary>Nâng cấp: xem hoặc chỉnh số trang, nhập lại dòng lỗi</summary>
  <p class="muted">Sau khi quét, bảng này hiện số trang AI tìm được. Có thể sửa tay nếu AI nhận sai, rồi bấm "Nhập các dòng chưa xong".</p>
  <div style="overflow:auto"><table id="rows"></table></div>
  <div class="row" style="margin-top:10px"><button class="btn ghost" id="rungo" onclick="runImport()">Nhập các dòng chưa xong</button><button class="btn ghost sm" onclick="addRows()">+ Thêm dòng</button></div></details>`);
  renderRows(); renderLog();
}
const RNG = ps => {
  ps = [...new Set(ps)].sort((a, b) => a - b); const out = []; let a = ps[0], b = a;
  for (const p of ps.slice(1)) { if (p <= b + 3) b = p; else { out.push(a === b ? '' + a : a + '-' + b); a = b = p; } }
  out.push(a === b ? '' + a : a + '-' + b); return out.join(', ');
};
function buildRows(labels, bookName) {
  const by = {};
  labels.forEach((l, i) => {
    if (!l || l.k === 'X') return;
    (Array.isArray(l.t) ? l.t : [l.t]).forEach(t => { t = +t; if (!t) return; (by[l.k + t] = by[l.k + t] || []).push(i + 1); });
  });
  const kinds = { L: 'listening', R: 'reading', W: 'writing', S: 'speaking' }, rows = [];
  Object.entries(kinds).forEach(([k, type]) => {
    const nums = [...new Set(Object.keys(by).filter(x => x[0] === k).map(x => +x.slice(1)))].sort((a, b) => a - b);
    nums.forEach(n => rows.push({
      type, name: `${bookName} Test ${n} ${type[0].toUpperCase() + type.slice(1)}`, pages: RNG(by[k + n]),
      ans: (type === 'listening' || type === 'reading') && by['A' + n] ? RNG(by['A' + n]) : '',
      script: type === 'listening' && by['T' + n] ? RNG(by['T' + n]) : ''
    }));
  });
  return rows;
}
async function scanBook() {
  const n = BOOK.pages, labels = new Array(n).fill(null), slog = h => { const e = $('#slog'); if (e) e.innerHTML = h; };
  const idxs = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);
  let start = 0, prev = null;
  while (start < n) {
    let end = Math.min(start + 25, n), u;
    for (;;) { u = await extractPages(idxs(start, end)); if (u.length <= 12 * 1024 * 1024 || end - start <= 1) break; end = start + Math.max(1, Math.floor((end - start) / 2)); }
    slog(`Đang quét trang ${start + 1}–${end} / ${n}…`);
    const prompt = `You are indexing a printed IELTS practice book (Cambridge style). The attached PDF has ${end - start} pages; number them 1..${end - start} in order. For EACH page return what it contains.
Kinds: "L" = Listening test pages (question pages of Part/Section 1-4), "R" = Reading test pages (passages and questions), "W" = Writing test pages, "S" = Speaking test pages (Part 1/2/3 questions or cue cards), "A" = answer key pages, "T" = audioscript/transcript pages, "X" = anything else (cover, contents, introduction, tips, sample answers, blank).
"t" = the test number (integer) the page belongs to; null for kind X. If a page continues a test without printing its number, carry the number from the previous page.${prev ? ` The page just before this chunk was kind ${prev.k}, test ${JSON.stringify(prev.t)}.` : ''}
For "A" and "T" pages that contain several tests, give "t" as an array of all test numbers on that page.
Return JSON only: {"pages":[{"p":1,"k":"L","t":1}]} with exactly one entry per page.`;
    let r;
    for (let tr = 0; ; tr++) {
      try { r = await gem([{ inline_data: { mime_type: 'application/pdf', data: u8b64(u) } }, { text: prompt }], true, 8192); break; }
      catch (e) { if (tr >= 1) throw e; slog('Lỗi tạm thời, thử lại…'); await sleep(5000); }
    }
    (r.pages || []).forEach(x => { const i = start + (+x.p) - 1; if (i >= start && i < end) labels[i] = { k: 'LRWSATX'.includes(x.k) ? x.k : 'X', t: x.t }; });
    for (let i = end - 1; i >= start; i--) if (labels[i]) { prev = labels[i]; break; }
    start = end; await sleep(800);
  }
  IR = buildRows(labels, BOOK.name).map(r => ({ ...r, status: '' }));
  const cnt = t => IR.filter(r => r.type === t).length;
  slog(IR.length ? `<span class="ok">Đã quét xong.</span> Tìm thấy: Listening ${cnt('listening')}, Reading ${cnt('reading')}, Writing ${cnt('writing')}, Speaking ${cnt('speaking')} đề.` : '<span class="err">Không tìm thấy đề nào trong sách. Có thể file không phải sách luyện thi hoặc quá mờ.</span>');
  renderRows();
}
async function scanOnly() {
  if (!BOOK) { $('#slog').innerHTML = '<span class="err">Hãy chọn file PDF sách ở bước 1.</span>'; return; }
  $('#autogo').disabled = true; $('#scango').disabled = true;

}

function history() {

  const tsRows = Object.entries(ts).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).map(([k, [a, b]]) => `<tr><td>${esc(QL[k] || k)}</td><td>${a}/${b}</td><td><b>${Math.round(a / b * 100)}%</b></td></tr>`).join('');
  const critBox = (skill, label) => {
    const a = S.history.filter(x => x.skill === skill && x.crit).slice(-5); if (!a.length) return '';
    return `<h3>${label} – trung bình ${a.length} bài gần nhất</h3><div class="crit">${Object.keys(a[0].crit).map(k => `<div><span class="muted">${k}</span><b>${round5(a.reduce((s, x) => s + (x.crit[k] || 0), 0) / a.length)}</b></div>`).join('')}</div>`;
  };
  app(`<h1>Tiến độ</h1>
  <div class="card"><h3>15 bài gần nhất</h3>${last.length ? `<div class="bars" style="margin-top:24px">${last.map(x => `<div title="${esc(x.skill)}" style="height:${x.band / 9 * 100}%"><span>${x.band}</span></div>`).join('')}</div>` : '<p class="muted">Chưa có dữ liệu.</p>'}</div>
  ${tsRows ? `<div class="card"><h3>Độ chính xác theo dạng câu (Reading + Listening)</h3><p class="muted">Dạng ở trên cùng là dạng bạn yếu nhất, nên ưu tiên luyện.</p><table><tr><th>Dạng câu</th><th>Đúng</th><th>Tỉ lệ</th></tr>${tsRows}</table></div>` : ''}
  ${(critBox('writing', 'Writing') + critBox('speaking', 'Speaking')) ? `<div class="card">${critBox('writing', 'Writing')}${critBox('speaking', 'Speaking')}</div>` : ''}

  app(`<h1>Cài đặt</h1><div class="card">
  <label>Gemini API key</label><input id="k" type="password" value="${esc(S.key)}" placeholder="AIza…">
  <p class="muted">Lấy key miễn phí tại <a target="_blank" rel="noopener" href="https://aistudio.google.com/apikey">aistudio.google.com/apikey</a>. Key chỉ lưu trong trình duyệt của bạn (localStorage), không nằm trong code trên GitHub. Mỗi thiết bị nhập một lần.</p>
  <label>Tên model</label><input id="m" value="${esc(S.model)}"><p class="muted">Nếu báo lỗi model không tồn tại, đổi sang model Gemini Flash mới nhất trong AI Studio. Nhập đề từ PDF cần model hỗ trợ đọc file.</p>
  <div class="row"><button class="btn" onclick="S.key=$('#k').value.trim();S.model=$('#m').value.trim();save();go('home')">Lưu</button>
  <button class="btn ghost" onclick="testKey()">Thử kết nối</button></div><div id="km"></div></div>
  <div class="card"><h3>Sao lưu dữ liệu</h3><p class="muted">Đề, bài viết và lịch sử nằm trong trình duyệt này. Xuất file để không mất khi xoá cache hoặc đổi máy (file xuất không chứa API key và file audio; audio cần chọn lại sau khi khôi phục).</p>
  <div class="row"><button class="btn ghost" onclick="exportData()">Xuất file</button><input type="file" accept=".json" style="max-width:240px" onchange="importData(this)"></div></div>`);
}
async function testKey() { S.key = $('#k').value.trim(); S.model = $('#m').value.trim(); save(); $('#km').textContent = 'Đang thử…'; try { await gem([{ text: 'Reply with the word OK' }], false, 64); $('#km').innerHTML = '<p class="ok">Kết nối thành công.</p>'; } catch (e) { $('#km').innerHTML = `<p class="err">${esc(e.message)}</p>`; } }
function exportData() { const d = { ...S, key: '' }; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 1)], { type: 'application/json' })); a.download = 'ielts-backup.json'; a.click(); }
function importData(el) { const f = el.files[0]; if (!f) return; f.text().then(t => { try { const d = JSON.parse(t); S = { ...S, tests: d.tests || S.tests, history: d.history || S.history, bank: d.bank || S.bank }; save(); alert('Đã khôi phục.'); go('home'); } catch { alert('File không hợp lệ.'); } }); }

go('home');
</script>
</body>
</html>
